<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div class="container" style="background-color: blueviolet; 
    border-radius: .5em; height: 25%; width: 25%; gap: 2em;justify-content: center;
    display: flex; flex-direction: column; align-items: center; padding: 2em;">
        <div style="font-weight: bold; font-size: large;">
            Jogo da Velha
        </div>
        <div>
            <input type="text" name="username" id="username" placeholder="Username..">
            <input type="button" value="Entrar" id="sendUsername">
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendUsername');
        sendBtn.addEventListener('click', ()=>{
            const username = document.getElementById('username').value;
            if(username.length >= 5){
                localStorage.setItem('username', username);
                localStorage.setItem('confirmation', Date.now());
                window.location.href = "/frontend/index.html";
                return;
            }
            alert("O username deve ter ao menos 5 caracteres")
        })

    </script>
</body>
</html>

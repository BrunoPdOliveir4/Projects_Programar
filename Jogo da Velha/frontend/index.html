<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room</title>
</head>
<body style="display: flex; height: 100vh; margin: 0">
    <div style="width: 100%;">
        <div id="header" style="height: 10%; width: 100%;
        display: flex; flex-direction: column; 
        justify-content: center; align-items: center;
        border-bottom: solid;border-color: black;">
            <h2 for=>Pessoas na Sala:  <label id="quantidade"> 0 </label></h2>
            <div class="access" id="access">
                <label for="gameIdInput">Escolha o ID da sala:</label>
                <input type="number" id="gameIdInput" value="1" />
                <button id="joinButton">Entrar na sala</button>
            </div>
        </div>
        
        <div id="game" style="display: flex; justify-content: center; align-items: center; height: 80%;">
            <div class="board" style="display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;">
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" 
                    id="cell-1" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-2" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-3" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-4" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-5" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-6" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-7" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-8" name="playable">
                </div>
                <div style="width: 100px;
                    height: 100px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2em;
                    border: 2px solid black;
                    cursor: pointer;" id="cell-9" name="playable">
                </div>
            </div>
        </div>
        <!-- Optionally allow the user to specify a game ID -->
    </div>
    <div style="width: 20%; height: 100%; background-color: lightgrey;border-left: solid; border-color: black;">
        <div style="display: flex; flex-direction: column;
        justify-content: center; align-items: center; height: 10%;">
            <h2>chat</h2>
        </div>
        <div id="chat-messages" style="width: 100%; height: 80%;">
            
        </div>
        <div id="chat-input" style="display: flex;
        justify-content: space-around; align-items: center; height: 10%;">
            <input type="text" name="msgInput" id="myMsg" placeholder="Escreva uma mensagem">
            <input type="button" value="Enviar" id="sendMsg">
        </div>
    </div>

    <script type="module">
        import { io } from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";
        
        const socket = io('http://localhost:3003');
        let currentGameId = 1;
        const message = document.getElementById('sendMsg');
        const username = localStorage.getItem('username');
        

        // Listen for the "in" event when a player enters the room
        socket.on("in", (data) => {
            document.getElementById("quantidade").innerHTML = data.quantity;
            console.log(data);
        });

        // Optionally listen for "out" event if players disconnect
        socket.on("out", (data) => {
            document.getElementById("quantidade").innerHTML = data.quantity;
            console.log(data);
        });

        socket.on('err', (data) =>{
            alert(data.message);
        })

        socket.on('newMsg', (data)=>{
            document.getElementById('chat-messages').innerHTML += `
            <div>
                ${data.username}: ${data.message}
            </div>
            `
        })

        socket.on('gameUpdate', (data) =>{
            
        })

        message.addEventListener('click', ()=>{
            let myMsg = document.getElementById('myMsg').value;
            if(myMsg.length > 0){
                socket.emit('sendMsg', ({gameId: currentGameId, message: myMsg, username}))
            }
        })

        // Join game when user presses the button
        document.getElementById("joinButton").addEventListener("click", () => {
            const gameIdInput = document.getElementById("gameIdInput");
            currentGameId = gameIdInput.value; // Get the game ID from input
            socket.emit("conn", { gameId: currentGameId }); // Notify server with the selected game ID
        });
        const playableSpots = document.getElementsByName('playable');
        playableSpots.forEach(playableSpot => {
            playableSpot.addEventListener('click', ()=>{
                socket.emit('play', {gameId: currentGameId, username, play: playableSpot});
                console.log(playableSpot);
                alert(playableSpot);
                playableSpot.innerHTML = 'X'
        })})
    </script>
</body>
</html>
